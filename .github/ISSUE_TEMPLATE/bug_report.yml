name: Bug report
description: Report a reproducible NEXUS problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove tokens, private prompts, project contents, and personal paths. Never upload your workspace database."
  - type: input
    id: version
    attributes:
      label: NEXUS version
      placeholder: "0.5.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: "Use None if the issue does not involve an AI provider."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Include a redacted error message or screenshot if useful."
    validations:
      required: true
